<aside class="sidebar-wrapper" [class.collapsed]="collapsed">
  <div class="sidebar-container">
    
    <!-- Profile Section -->
    <div class="profile-section" *ngIf="!collapsed">
      <div class="avatar-ring-wrap">
        <div class="avatar-img">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="#ffffff">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </div>
      </div>
      <h3 class="user-fullname">Welcome {{ roleDisplayName }}</h3>
      <span class="user-email">{{ loggedInUserName }}</span>
    </div>

    <!-- Sidebar Toggle (collapses / expands the sidebar) -->
    <button class="sidebar-toggle-btn"
            [title]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'"
            [attr.aria-label]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'"
            (click)="onToggle()">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" [class.rotate]="collapsed">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <div class="nav-list">

      <!-- ================= MAIN CATEGORY ================= -->
      <div class="nav-category-header" *ngIf="!collapsed">MAIN</div>
      <div class="nav-category-divider" *ngIf="collapsed"></div>

      <!-- Dashboard -->
      <div class="nav-item" [class.active]="isActive('/dashboard')" (click)="openDashboard()" title="Dashboard">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
        </div>
        <span class="nav-label" *ngIf="!collapsed">Dashboard</span>
      </div>

      <!-- Groups & Subgroups -->
      <div class="nav-item" [class.active]="isActive('/groups-subgroups')" (click)="openGroupManagement()" title="Groups & Subgroups">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"></rect>
            <path d="M7 8h10M7 12h7M7 16h4"></path>
          </svg>
        </div>
        <span class="nav-label" *ngIf="!collapsed">Groups &amp; Subgroups</span>
      </div>

 
      <!-- ================= MANAGEMENT CATEGORY ================= -->
      <div class="nav-category-header" *ngIf="!collapsed">MANAGEMENT</div>
      <div class="nav-category-divider" *ngIf="collapsed"></div>

      <!-- Broadcast Notices -->
      <div class="nav-item" [class.active]="isActive('/broadcast')" (click)="openBroadcast()" title="Broadcast Notices">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
        </div>
        <span class="nav-label" *ngIf="!collapsed">Broadcast Notices</span>
      </div>

     
      <div
        *ngIf="canViewDraftMessages"
        class="nav-item"
        [class.active]="isActive('/draft-messages')"
        (click)="openDraftMessages()"
        title="Draft Message">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16v16H4z"></path>
            <path d="M8 8h8M8 12h8M8 16h5"></path>
          </svg>
        </div>
        <span class="nav-label" *ngIf="!collapsed">Draft Message</span>
      </div>

      <div class="nav-item" [class.active]="isActive('/send-broadcast')" (click)="openSendBroadcast()" title="Send Broadcast">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
        </div>
        <span class="nav-label" *ngIf="!collapsed">Send Notification</span>
      </div>

      <!-- Message Campaigns -->
      <div class="nav-item" [class.active]="isActive('/campaigns') && !isActive('/campaigns/create')" (click)="openCampaigns()" title="Campaigns">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
            <line x1="4" y1="22" x2="4" y2="15"></line>
          </svg>
        </div>
        <span class="nav-label" *ngIf="!collapsed">Campaigns</span>
      </div>

      <!-- Campaign Form -->
      <div class="nav-item" [class.active]="isActive('/campaigns/create') || isActive('/campaign-form')" (click)="openCampaignForm()" title="Create Campaign">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
          </svg>
        </div>
        <span class="nav-label" *ngIf="!collapsed">New Campaign</span>
      </div>

      <!-- Interest Advisories -->
      <div class="nav-item" [class.active]="isActive('/interest-message')" (click)="openInterestMessage()" title="Interest Advisories">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="6"></circle>
            <circle cx="12" cy="12" r="2"></circle>
          </svg>
        </div>
        <span class="nav-label" *ngIf="!collapsed">Interest Advisories</span>
      </div>

      <!-- Gallery -->
      <div class="nav-item" [class.active]="isActive('/gallery-admin')" (click)="openGallery()" title="Gallery">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </div>
        <span class="nav-label" *ngIf="!collapsed">Gallery</span>
      </div>

      <!-- Reports -->
      <div class="nav-item" title="Reports">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"/>
            <line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="6" y1="20" x2="6" y2="14"/>
          </svg>
        </div>
        <span class="nav-label" *ngIf="!collapsed">Reports</span>
      </div>

      <!-- Settings -->
      <div class="nav-item" title="Settings">
        <div class="nav-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </div>
        <span class="nav-label" *ngIf="!collapsed">Settings</span>
      </div>

    </div>

    <!-- Bottom Logout Section -->
    <div class="sidebar-bottom-section">
      <div class="nav-item logout-nav-item" (click)="openLogin()" title="Logout">
        <div class="nav-icon logout-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </div>
        <span class="nav-label logout-label" *ngIf="!collapsed">Logout</span>
      </div>
    </div>

  </div>
</aside>
